<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meus Certificados</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main class="certificados">

    <header class="certificados-cabecalho">
      <h1>Meus Certificados</h1>
      <p>
        Sejam muito bem-vindos à seção de certificados,
        onde apresento minha trajetória de qualificações.
      </p>
    </header>

    <section
      class="certificados-lista"
      aria-label="Lista de certificados"
    >

      <article class="certificado-card">

        <div class="certificado-moldura">

          <a
            href="https://drive.google.com/file/d/1LYmoGZKY3xrvR6Sx-vtzlOV30lYPqeGn/view?usp=drivesdk"
            class="certificado-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir certificado em uma nova aba"
          >

            <img
              src="./img/certificado1.jpg"
              alt="Certificado da Aula Magna Trilhas Inova Maranhão. Clique para abrir o certificado."
              class="certificado-imagem"
            >

          </a>

        </div>

      </article>

    </section>

    <div class="voltar-container">
      <a href="./index.html" class="botao-voltar">
        <span class="seta-voltar" aria-hidden="true">&larr;</span>
        Voltar para o início
      </a>
    </div>

  </main>
</body>
</html>
